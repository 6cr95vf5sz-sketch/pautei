<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pautei — protótipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: produto real, amigável e confiante — a identidade "Pautei" do Figma
   IDEA: a agenda editorial de um studio: o mês inteiro montado, pronto pra postar
   PICTURE: as próprias telas — calendário, pautas, artes e o feed vivo
   COLOUR and TYPE: variáveis "Pautei / Cores" do Figma; Bricolage Grotesque + Figtree
   LAYOUT: menu lateral, cabeçalho com troca de nicho, conteúdo em cartões */
:root{color-scheme:light;--ink:#15131F;--bg:#F8F4EF;--surface:#FFFFFF;--line:#E7E3DA;--muted:#6E6A7C;--brand:#5B3DF5;--brandSoft:#ECE8FF;--lime:#D6F55B;--fisio:#0E9F84;--fisioSoft:#DDF4F1;--adv:#23345E;--advSoft:#E4EBF2;--advGold:#C9A24B;--coral:#FF6B4A;--coralSoft:#FFE7E1;--nc:var(--fisio);--ncSoft:var(--fisioSoft);--art:var(--fisio);--r:20px;--ease:cubic-bezier(.2,.8,.2,1)}
body.adv{--nc:var(--adv);--ncSoft:var(--advSoft)}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Figtree,system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
h1,h2,h3,.disp{font-family:"Bricolage Grotesque",Figtree,sans-serif;letter-spacing:-.02em;margin:0;line-height:1.05;text-wrap:balance}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:10px}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 20px;border-radius:999px;font-weight:600;transition:transform .2s var(--ease),background .2s,box-shadow .2s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--brand);color:#fff;box-shadow:0 6px 18px -8px var(--brand)}
.btn.pri:hover{background:#4a2de6}
.btn.ghost{background:var(--surface);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.dark{background:var(--ink);color:#fff}
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.logo{display:flex;align-items:center;gap:10px;font-family:"Bricolage Grotesque";font-weight:800;font-size:20px}
.logo i{width:30px;height:30px;border-radius:9px;background:var(--brand);color:#fff;display:grid;place-items:center;font-style:normal;font-size:16px}
.eyebrow{font-size:12px;font-weight:700;color:var(--brand);letter-spacing:.06em}
.muted{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--bg);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.view{animation:in .45s var(--ease) both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:none;opacity:1}}

/* ---------- Onboarding ---------- */
#onb{min-height:100%;display:flex;flex-direction:column;padding:28px max(5vw,20px)}
.onb-top{display:flex;justify-content:space-between;align-items:center}
.steps{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.steps b{height:6px;border-radius:9px;background:var(--line);width:16px;transition:all .4s var(--ease)}
.steps b.on{background:var(--brand);width:34px}
.onb-body{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:1180px;width:100%;margin:0 auto;padding:36px 0}
.onb-body h1{font-size:clamp(34px,5vw,56px);font-weight:800;margin:10px 0 14px}
.niches{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:34px}
.niche{text-align:left;padding:24px;border-radius:22px;background:var(--surface);border:2px solid var(--line);position:relative;transition:all .3s var(--ease)}
.niche:hover{transform:translateY(-3px);box-shadow:0 18px 40px -24px rgba(21,19,31,.35)}
.niche.sel{border-color:var(--c)}
.niche .nic{width:46px;height:46px;border-radius:13px;background:var(--cs);color:var(--c);display:grid;place-items:center;margin-bottom:18px}
.niche h3{font-size:24px;font-weight:800}
.niche .sub{color:var(--c);font-weight:600;font-size:13px;margin:6px 0 12px}
.niche ul{margin:0;padding:0 0 0 18px;font-size:13.5px;color:var(--muted)}
.niche .ok{position:absolute;top:20px;right:20px;width:26px;height:26px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;transform:scale(0);transition:transform .3s var(--ease)}
.niche.sel .ok{transform:scale(1)}
.niche.soon{opacity:.55;cursor:default}
.niche.soon:hover{transform:none;box-shadow:none}
.onb-foot{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;max-width:1180px;width:100%;margin:0 auto}
.brandgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,5vw,64px);align-items:center}
.field{margin-top:18px}
.field label{display:block;font-weight:700;font-size:13px;margin-bottom:8px}
.inp{width:100%;min-height:46px;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:0 14px;font-size:16px}
.inp:focus{outline:2px solid var(--brand);border-color:transparent}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw button{width:38px;height:38px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line);transition:transform .2s var(--ease)}
.sw button.on{box-shadow:0 0 0 2px var(--ink);transform:scale(1.08)}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pills button{min-height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13.5px;transition:all .2s}
.pills button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.preview-side{background:var(--ncSoft);border-radius:28px;padding:clamp(24px,4vw,48px);display:grid;place-items:center;gap:14px;transition:background .4s}
.live{font-size:12px;font-weight:600;background:var(--surface);padding:5px 12px;border-radius:99px;display:flex;gap:6px;align-items:center}
.live .dot{background:var(--fisio);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}

/* ---------- Arte (template) ---------- */
.art{container-type:inline-size;aspect-ratio:4/5;border-radius:16px;background:var(--a,var(--art));color:#fff;position:relative;overflow:hidden;padding:7%;width:100%;display:flex;flex-direction:column;justify-content:flex-end;transition:background .4s}
.art .hd{position:absolute;top:7cqw;left:7cqw;right:7cqw;display:flex;justify-content:space-between;align-items:center;font-size:3.6cqw;font-weight:700;letter-spacing:.1em;opacity:.9}
.art .lg{width:9cqw;height:9cqw;border-radius:50%;background:rgba(255,255,255,.95);color:var(--a,var(--art));display:grid;place-items:center;font-size:3.6cqw;font-weight:800;letter-spacing:0}
.art .t{font-family:"Bricolage Grotesque";font-weight:800;font-size:9.6cqw;line-height:1.02;letter-spacing:-.02em;text-wrap:balance}
.art .cta{margin-top:5cqw;align-self:flex-start;background:var(--lime);color:var(--ink);font-weight:700;font-size:3.8cqw;padding:2cqw 4cqw;border-radius:99px}
.art .shape{position:absolute;border-radius:50%;background:rgba(255,255,255,.12)}
.art.s-light{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.art.s-light .lg{background:var(--a,var(--art));color:#fff}
.art.s-light .t em{color:var(--a,var(--art))}
.art.s-lime{background:var(--lime);color:var(--ink)}
.art.s-lime .lg{background:var(--ink);color:var(--lime)}
.art.s-dark{background:var(--ink)}
.art .t em{font-style:normal;color:var(--lime)}
.art .ph{position:absolute;inset:0;background-repeat:no-repeat;background-size:cover}
.art .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(21,19,31,.15) 30%,rgba(21,19,31,.78))}
.art.has-ph{color:#fff}
.art .t,.art .cta,.art .tag,.art .vs,.art>div:not(.ph):not(.hd){position:relative}
.ex-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}
.ex-row button{min-height:64px;border:1px solid var(--line);border-radius:14px;background:var(--surface);font-weight:700;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:all .2s var(--ease)}
.ex-row button small{font-weight:500;color:var(--muted);font-size:11px}
.ex-row button:hover{border-color:var(--ink);transform:translateY(-2px)}
.lock{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-top:8px}
.photo-ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.photo-ctl input[type=range]{flex:1;min-width:120px;accent-color:var(--brand)}
.stage.dragging{cursor:grabbing}.stage.can-drag{cursor:grab}
.expanel{margin-top:14px;padding:16px;border-radius:16px;background:var(--bg);animation:in .35s var(--ease) both;font-size:13.5px}
.expanel ul{margin:8px 0 0;padding-left:0;list-style:none;display:grid;gap:4px}
.expanel li{display:flex;gap:8px;align-items:center}
.expanel li i{font-style:normal;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--surface);color:var(--muted)}
.fb{display:flex;gap:6px;flex-wrap:wrap;margin-top:-6px;align-self:flex-start}
.fb button{font-size:12px;font-weight:600;min-height:32px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface)}
.fb button:hover{border-color:var(--ink)}
.fb .ok{color:var(--fisio);font-weight:700;font-size:12px;display:flex;gap:4px;align-items:center}
.msg textarea{width:100%;min-height:140px;border:1px solid var(--line);border-radius:12px;padding:10px;font:inherit;background:var(--surface)}
.mem{display:grid;gap:6px;max-height:240px;overflow:auto}
.mem div{font-size:12.5px;padding:7px 10px;border-radius:10px;background:var(--bg);animation:pop .35s var(--ease) both}
.mem div b{font-weight:700}
.meter{height:8px;border-radius:9px;background:var(--bg);overflow:hidden}.meter i{display:block;height:100%;background:var(--nc);transition:width .6s var(--ease)}
.tpl.excl .art{outline:2px dashed var(--brand);outline-offset:4px}
.pro{position:absolute;top:10px;left:10px;z-index:2;background:var(--brand);color:#fff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px}
.tag-row{display:flex;gap:6px;flex-wrap:wrap}
.tag-row span{font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line);display:flex;gap:6px;align-items:center}
.tag-row span button{font-size:14px;line-height:1;color:var(--muted);min-height:0}
.dna{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 28px}
.dna .full{grid-column:1/-1}
@media(max-width:700px){.dna{grid-template-columns:minmax(0,1fr)}.ex-row{grid-template-columns:minmax(0,1fr)}}
.art .tag{align-self:flex-start;font-size:3.6cqw;font-weight:700;padding:1.5cqw 3.5cqw;border-radius:99px;background:rgba(255,255,255,.18);margin-bottom:4cqw}
.art.s-light .tag{background:var(--bg)}
.art .vs{display:grid;grid-template-columns:1fr 1fr;gap:3cqw;margin-top:5cqw;font-size:3.8cqw;font-weight:700}
.art .vs span{padding:3cqw;border-radius:3cqw;background:rgba(255,255,255,.15)}
.art .vs span:last-child{background:var(--lime);color:var(--ink)}

/* ---------- App shell ---------- */
#app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.side .logo{padding:0 8px 18px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:0 14px;border-radius:12px;font-weight:600;font-size:14.5px;color:var(--ink);transition:background .2s,color .2s}
.nav button:hover{background:var(--bg)}
.nav button.on{background:var(--ink);color:#fff}
.upsell{margin-top:auto;background:var(--lime);border-radius:18px;padding:16px}
.upsell small{font-size:11px;font-weight:700;letter-spacing:.06em}
.upsell p{font-family:"Bricolage Grotesque";font-weight:800;font-size:19px;line-height:1.1;margin:6px 0 12px}
.me{display:flex;align-items:center;gap:10px;padding:14px 8px 0;font-size:13px}
.av{width:34px;height:34px;border-radius:50%;background:var(--ncSoft);color:var(--nc);font-weight:700;display:grid;place-items:center;font-size:12px;flex:none;transition:all .4s}
main{padding:24px clamp(16px,3vw,36px) 60px;max-width:1280px;width:100%}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.top small{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.top h1{font-size:clamp(28px,3.4vw,40px);font-weight:800;margin-top:6px}
.acts{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seg{position:relative;display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.seg button{position:relative;z-index:1;min-height:36px;padding:0 14px;border-radius:999px;font-weight:600;font-size:13px;display:flex;gap:6px;align-items:center;transition:color .3s}
.seg button.on{color:#fff}
.seg .knob{position:absolute;top:4px;bottom:4px;border-radius:999px;background:var(--nc);transition:all .45s var(--ease)}
.round{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;position:relative}
.round .badge{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--coral);border:2px solid var(--surface)}

/* Início */
.g-home{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:18px}
.hero{background:var(--brand);color:#fff;border-radius:24px;padding:28px;display:flex;flex-direction:column;justify-content:space-between;min-height:280px;position:relative;overflow:hidden}
.hero .chip{background:var(--lime);color:var(--ink);align-self:flex-start;font-size:11px;letter-spacing:.04em}
.hero h2{font-size:clamp(28px,3.3vw,40px);font-weight:800;margin:16px 0 28px;max-width:16ch}
.bar{height:10px;border-radius:9px;background:rgba(255,255,255,.2);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--lime);border-radius:9px;transition:width 1.2s var(--ease)}
.hero .row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:13px;gap:10px;flex-wrap:wrap}
.hero .btn{background:#fff;color:var(--ink);min-height:40px}
.hero .orb{position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.07)}
.today{padding:18px;display:flex;flex-direction:column;gap:12px}
.today .art{aspect-ratio:auto;min-height:170px;border-radius:14px}
.today .art .t{font-size:clamp(18px,7.4cqw,26px)}
.week{padding:20px;grid-column:1}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-top:14px}
.day{border-radius:14px;background:var(--bg);padding:10px;min-height:136px;display:flex;flex-direction:column;gap:6px;font-size:12.5px;text-align:left;transition:transform .2s var(--ease)}
.day:hover{transform:translateY(-2px)}
.day.now{background:var(--ncSoft);outline:1.5px solid var(--nc)}
.day .dh{display:flex;justify-content:space-between;font-size:10.5px;font-weight:700;color:var(--muted)}
.day .dh b{color:var(--ink);font-size:12px}
.day p{margin:0;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.day .st{margin-top:auto;font-size:11px;font-weight:600;color:var(--fisio);display:flex;gap:4px;align-items:center}
.sugg{background:var(--ink);color:#fff;border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:14px}
.sugg small{color:var(--lime);font-weight:700;font-size:11px;letter-spacing:.06em}
.sugg h3{font-size:22px;font-weight:700}
.sugg .btn{align-self:flex-start;margin-top:auto}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sec-h h2{font-size:22px;font-weight:800}
.link{color:var(--brand);font-weight:600;font-size:13px;display:inline-flex;gap:4px;align-items:center;min-height:32px}

/* Calendário */
.cal-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-left:auto}
.legend span{display:flex;gap:6px;align-items:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.cal .wd{background:var(--surface);font-size:11px;font-weight:700;color:var(--muted);padding:10px;letter-spacing:.06em}
.cal .c{background:var(--surface);min-height:108px;padding:8px;display:flex;flex-direction:column;gap:5px}
.cal .c.out{background:var(--bg)}
.cal .n{font-size:12px;font-weight:700;color:var(--muted)}
.cal .c.hol .n{color:var(--coral)}
.pchip{text-align:left;font-size:11.5px;font-weight:600;line-height:1.25;padding:6px 8px;border-radius:9px;background:var(--pc);color:var(--pt,#fff);transition:transform .2s var(--ease);display:flex;gap:6px;align-items:flex-start}
.pchip:hover{transform:scale(1.03)}
.pchip.done::before{content:"✓";font-weight:800}

/* Pautas */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.filters .inp{max-width:300px;min-height:42px;border-radius:999px;padding-left:40px}
.sbox{position:relative}
.sbox .ic{position:absolute;left:14px;top:12px;color:var(--muted)}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.pauta{padding:18px;display:flex;flex-direction:column;gap:10px;animation:pop .4s var(--ease) both}
.pauta h3{font-size:19px;font-weight:700;line-height:1.15}
.pauta .hook{font-size:13.5px;color:var(--muted);margin:0}
.pauta .foot{display:flex;gap:8px;margin-top:auto;padding-top:6px}
.pauta .foot .btn{min-height:38px;padding:0 14px;font-size:13px}
.pauta.used{border-color:var(--nc)}

/* Templates */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.tpl{display:flex;flex-direction:column;gap:10px;text-align:left;animation:pop .45s var(--ease) both}
.tpl .art{transition:transform .35s var(--ease),box-shadow .35s}
.tpl:hover .art{transform:translateY(-4px) rotate(-.6deg);box-shadow:0 22px 40px -22px rgba(21,19,31,.5)}
.tpl b{font-size:14px}

/* Editor modal */
.modal{position:fixed;inset:0;background:rgba(21,19,31,.45);display:grid;place-items:center;padding:16px;z-index:20;animation:fade .25s both}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--surface);border-radius:26px;width:min(980px,100%);max-height:calc(100vh - 32px);overflow:auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);animation:pop .35s var(--ease) both}
.sheet .stage{background:var(--bg);padding:32px;display:grid;place-items:center}
.sheet .stage .art{width:min(360px,100%)}
.sheet .ctl{padding:28px;display:flex;flex-direction:column;gap:4px}
.sheet textarea.inp{min-height:84px;padding:12px 14px;resize:vertical}
.x{margin-left:auto}

/* Feed */
.feedwrap{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:28px;align-items:start}
.phone{background:var(--surface);border:1px solid var(--line);border-radius:32px;padding:18px 0 0;overflow:hidden;box-shadow:0 30px 60px -40px rgba(21,19,31,.5)}
.ig-h{display:flex;gap:16px;align-items:center;padding:0 18px}
.ig-av{width:70px;height:70px;border-radius:50%;padding:3px;background:conic-gradient(var(--lime),var(--brand),var(--art),var(--lime));flex:none}
.ig-av div{width:100%;height:100%;border-radius:50%;background:var(--art);border:3px solid var(--surface);color:#fff;display:grid;place-items:center;font-weight:800;font-family:"Bricolage Grotesque";font-size:20px}
.ig-st{display:flex;flex:1;justify-content:space-around;text-align:center;font-size:12px}
.ig-st b{display:block;font-size:16px}
.ig-bio{padding:12px 18px;font-size:13px;line-height:1.4}
.ig-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;margin-top:4px}
.ig-grid .cell{position:relative;cursor:grab}
.ig-grid .cell .art{border-radius:0;padding:6%}
.ig-grid .cell .art .t{font-size:11.5cqw}.ig-grid .cell .art .hd{font-size:4.5cqw}
.ig-grid .cell.drag{opacity:.4}
.ig-grid .cell.over .art{outline:3px solid var(--brand);outline-offset:-3px}
.ig-grid .cell .pin{position:absolute;top:6px;right:6px;background:rgba(21,19,31,.7);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px}
.tips{display:flex;flex-direction:column;gap:14px}
.tip{padding:18px;display:flex;gap:14px}
.tip .ic{width:22px;height:22px;color:var(--brand)}
.tip p{margin:4px 0 0;font-size:14px}

/* IA */
.chat{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:18px;height:calc(100vh - 170px);min-height:480px}
.thread{display:flex;flex-direction:column;overflow:hidden}
.msgs{flex:1;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:78%;padding:12px 16px;border-radius:18px;font-size:14.5px;line-height:1.5;animation:pop .3s var(--ease) both;white-space:pre-wrap}
.msg.u{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:6px}
.msg.a{align-self:flex-start;background:var(--bg);border-bottom-left-radius:6px}
.msg.a b{font-weight:700}
.typing span{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:4px;animation:bounce 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes bounce{40%{transform:translateY(-5px)}}
.composer{display:flex;gap:10px;padding:14px;border-top:1px solid var(--line)}
.composer .inp{border-radius:999px}
.sugs{display:flex;gap:8px;flex-wrap:wrap;padding:0 22px 12px}
.sugs button{font-size:13px;font-weight:600;padding:8px 14px;border-radius:999px;background:var(--brandSoft);color:var(--brand);min-height:36px;transition:transform .2s}
.sugs button:hover{transform:translateY(-2px)}
.agent{padding:20px;display:flex;flex-direction:column;gap:12px;align-self:start}
.agent .face{width:56px;height:56px;border-radius:18px;background:var(--nc);color:#fff;display:grid;place-items:center;transition:background .4s}
.agent ul{margin:0;padding-left:18px;font-size:13.5px;color:var(--muted)}

/* Drawer + toast + loader */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);z-index:21;box-shadow:-30px 0 60px -30px rgba(21,19,31,.4);padding:24px;display:flex;flex-direction:column;gap:14px;animation:slide .4s var(--ease) both;overflow:auto}
@keyframes slide{from{transform:translateX(100%)}}
.drawer .art{width:220px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:30;display:flex;gap:8px;align-items:center;animation:toast 2.6s var(--ease) both}
@keyframes toast{0%{opacity:0;transform:translate(-50%,16px)}12%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,8px)}}
.loader{position:fixed;inset:0;background:var(--brand);color:#fff;display:grid;place-items:center;z-index:40;animation:fade .3s both}
.loader .in{text-align:center;display:grid;gap:18px;justify-items:center}
.loader h2{font-size:clamp(28px,4vw,44px);font-weight:800}
.loader .bar{width:260px}
.loader ol{list-style:none;padding:0;margin:0;font-size:15px;display:grid;gap:6px;min-height:90px}
.loader li{animation:in .4s var(--ease) both}
.hidden{display:none!important}
.note{font-size:12px;color:var(--muted);margin-top:18px}

.fblogo{width:34px;height:34px;border-radius:50%;background:#1877F2;color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px;font-family:Figtree,sans-serif;flex:none}
.cklist{display:grid;gap:10px;margin:6px 0 4px}
.ck{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;background:var(--bg);font-size:14px;transition:background .3s}
.ck.ok{background:var(--fisioSoft)}.ck.no{background:var(--coralSoft)}
.ckicon{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--surface);font-weight:800;color:var(--coral)}
.ck.ok .ckicon{background:var(--fisio);color:#fff}.ck.ok .ckicon .ic{width:15px;height:15px;stroke-width:3}
.ck.no .ckicon{background:var(--coral);color:#fff}
.spin{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--brand);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* Modo real */
.realbox{margin-top:16px;padding:16px;border-radius:16px;border:2px solid var(--brand);background:var(--brandSoft)}
.realbox .ic{color:var(--brand)}
.realban{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 18px;border-radius:18px;background:var(--fisioSoft);color:#0B5A4B;margin-bottom:18px;font-size:14px}
.realban span{flex:1;min-width:220px}.realban.off{background:var(--brandSoft);color:var(--ink)}
/* Foto de perfil e segurança */
.photo-field{display:flex;gap:14px;align-items:center;padding:12px;border:1px dashed var(--line);border-radius:16px;background:var(--surface)}
.avbig{position:relative;cursor:pointer;flex:none}
.avimg{width:64px;height:64px;border-radius:50%;background:var(--art);color:#fff;display:grid;place-items:center;font-family:"Bricolage Grotesque";font-weight:800;font-size:22px;transition:transform .25s var(--ease)}
.avbig:hover .avimg{transform:scale(1.05)}
.avcam{position:absolute;right:-2px;bottom:-2px;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;border:2px solid var(--surface)}
.avcam .ic{width:13px;height:13px}
.me{width:100%;border-radius:14px;padding:10px 8px!important;margin-top:10px;transition:background .2s}
.me:hover{background:var(--bg)}
.me .av{background-color:var(--ncSoft)}
.ig-in{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--art);border:3px solid var(--surface);color:#fff;font-weight:800;font-family:"Bricolage Grotesque";font-size:20px}
.safe{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;line-height:1.45;padding:10px 12px;border-radius:12px;background:var(--fisioSoft);color:#0B5A4B}
.safe .ic{width:16px;height:16px;flex:none;margin-top:1px}
/* Instagram, publicação e impulsionar */
.igbtn{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:8px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:left}
.iglogo{width:34px;height:34px;border-radius:10px;background:linear-gradient(45deg,#F9CE34,#EE2A7B 50%,#6228D7);display:grid;place-items:center;color:#fff;flex:none}
.iglogo .ic{width:18px;height:18px}
.igbtn.on{border-color:var(--fisio);background:var(--fisioSoft)}
.oauth{background:var(--surface);border-radius:24px;width:min(440px,100%);overflow:hidden;animation:pop .35s var(--ease) both}
.oauth .otop{background:linear-gradient(45deg,#F9CE34,#EE2A7B 50%,#6228D7);color:#fff;padding:22px;display:flex;align-items:center;gap:12px;margin:0}
.oauth .body{padding:22px;display:grid;gap:12px}
.perm{display:flex;gap:12px;align-items:flex-start;font-size:14px}
.perm .ic{color:var(--fisio);margin-top:2px}
.switch{display:flex;align-items:center;gap:12px;min-height:44px;cursor:pointer;font-weight:600}
.switch input{appearance:none;width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;transition:background .25s;flex:none;cursor:pointer}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .25s var(--ease)}
.switch input:checked{background:var(--brand)}.switch input:checked::after{transform:translateX(18px)}
.autoline{display:flex;gap:8px;align-items:center;font-size:12.5px;font-weight:600;color:var(--fisio)}
.autoline.off{color:var(--muted)}
.blist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.bpost{padding:14px;display:flex;flex-direction:column;gap:10px;position:relative;animation:pop .4s var(--ease) both}
.bpost .art{border-radius:12px}
.bpost .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;text-align:center;font-size:11.5px;color:var(--muted)}
.bpost .stats b{display:block;font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
.reco{position:absolute;top:22px;left:22px;z-index:2;background:var(--lime);color:var(--ink);font-size:11px;font-weight:800;padding:4px 10px;border-radius:99px}
.camp{display:flex;align-items:center;gap:14px;padding:14px 18px;flex-wrap:wrap}
.camp .art{border-radius:8px}
.camp .grow{flex:1;min-width:180px}
.st-chip{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--coralSoft);color:#B4401F}
.st-chip.live{background:var(--fisioSoft);color:var(--fisio)}
.wiz.still{animation:none}
.wiz{background:var(--surface);border-radius:26px;width:min(1000px,100%);max-height:calc(100vh - 32px);overflow:auto;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);animation:pop .35s var(--ease) both}
.wiz .l{padding:28px;display:flex;flex-direction:column;gap:6px}
.wiz .r{background:var(--bg);padding:28px;display:grid;place-items:center;gap:12px;align-content:center}
.wsteps{display:flex;gap:6px;align-items:center;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;flex-wrap:wrap}
.wsteps span{display:flex;gap:6px;align-items:center}.wsteps span.on{color:var(--brand)}.wsteps span.ok{color:var(--fisio)}
.wsteps i{width:18px;height:2px;background:var(--line);display:inline-block}
.opts{display:grid;gap:10px;margin-top:10px}
.opt{display:flex;gap:14px;align-items:center;text-align:left;padding:14px 16px;border-radius:16px;border:2px solid var(--line);background:var(--surface);transition:all .2s var(--ease)}
.opt:hover{border-color:var(--muted)}.opt.on{border-color:var(--brand);background:var(--brandSoft)}
.opt .oi{width:40px;height:40px;border-radius:12px;background:var(--bg);display:grid;place-items:center;flex:none}
.opt.on .oi{background:var(--brand);color:#fff}
.opt small{display:block;color:var(--muted);font-size:12.5px}
.rng{display:grid;gap:6px;margin-top:14px}
.rng .lab{display:flex;justify-content:space-between;font-weight:700;font-size:13px}
.rng .lab b{font-family:"Bricolage Grotesque";font-size:20px;color:var(--brand)}
.rng input{width:100%;accent-color:var(--brand)}
.est{margin-top:16px;padding:16px;border-radius:16px;background:var(--ink);color:#fff;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.est small{color:rgba(255,255,255,.65);font-size:12px;display:block}.est b{font-family:"Bricolage Grotesque";font-size:22px}
.adph{width:min(300px,100%);background:var(--surface);border-radius:20px;border:1px solid var(--line);overflow:hidden;box-shadow:0 20px 40px -28px rgba(21,19,31,.5);transition:all .35s var(--ease)}
.adph .ah{display:flex;gap:8px;align-items:center;padding:10px 12px;font-size:12px}
.adph .ah .av{width:28px;height:28px;font-size:10px;background:var(--art);color:#fff}
.adph .art{border-radius:0}
.adph .cta-bar{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--brandSoft);font-weight:700;font-size:13px;color:var(--brand)}
.adph .tx{padding:10px 12px;font-size:12.5px;line-height:1.4}
.adph.story{width:min(230px,100%);background:var(--ink);color:#fff;aspect-ratio:9/16;display:flex;flex-direction:column;justify-content:center;position:relative}
.adph.story .ah{position:absolute;top:0;left:0;right:0;color:#fff}
.adph.story .cta-bar{position:absolute;bottom:14px;left:14px;right:14px;border-radius:99px;justify-content:center;background:#fff}
.warn{font-size:12.5px;padding:10px 12px;border-radius:12px;background:var(--coralSoft);color:#9A3412;margin-top:8px}
.okn{font-size:12.5px;padding:10px 12px;border-radius:12px;background:var(--fisioSoft);color:#0B6B59;margin-top:8px}
.plans{background:var(--surface);border-radius:26px;width:min(1040px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:30px;animation:pop .35s var(--ease) both}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:22px}
.plan{border:1px solid var(--line);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:10px}
.plan.hl{background:var(--brand);color:#fff;border-color:var(--brand)}
.plan.dk{background:var(--ink);color:#fff;border-color:var(--ink)}
.plan .pr{font-family:"Bricolage Grotesque";font-weight:800;font-size:34px;letter-spacing:-.02em}.plan .pr small{font-size:14px;font-weight:600;opacity:.7}
.plan ul{list-style:none;padding:0;margin:0;display:grid;gap:8px;font-size:14px}
.plan li{display:flex;gap:8px}.plan li .ic{width:16px;height:16px;flex:none;margin-top:3px}
.plan .btn{margin-top:auto}
@media(max-width:860px){.wiz{grid-template-columns:minmax(0,1fr)}.pgrid{grid-template-columns:minmax(0,1fr)}}
/* Passo a passo */
.nav .grp{font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--muted);padding:16px 14px 6px}
.num{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none;transition:all .3s var(--ease)}
.num .ic{width:13px;height:13px;stroke-width:3}
.num.ok{background:var(--fisio);border-color:var(--fisio);color:#fff}
.num.cur{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 0 0 4px var(--brandSoft)}
.nav button.on .num:not(.ok):not(.cur){border-color:rgba(255,255,255,.5)}
.stepbar{display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px 18px;margin-bottom:20px;animation:in .4s var(--ease) both}
.stepbar .sb-l{flex:1;min-width:220px}
.stepbar .sb-n{font-size:12px;font-weight:700;color:var(--brand)}
.stepbar p{margin:2px 0 0;color:var(--muted);font-size:14px}
.sb-dots{display:flex;gap:6px}.sb-dots i{width:26px;height:6px;border-radius:9px;background:var(--line)}.sb-dots i.ok{background:var(--fisio)}.sb-dots i.cur{background:var(--brand);width:40px}
.stepfoot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:28px;padding-top:20px;border-top:1px solid var(--line)}
.journey{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.jstep{text-align:left;padding:16px;border-radius:18px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px;transition:transform .25s var(--ease)}
.jstep:hover{transform:translateY(-2px)}
.jstep .num{width:28px;height:28px;font-size:13px}
.jstep b{font-size:15px}.jstep small{font-size:12px;color:var(--muted)}
.jstep.cur{background:var(--brand);color:#fff;border-color:var(--brand)}.jstep.cur small{color:rgba(255,255,255,.8)}
.jstep.cur .num{background:#fff;color:var(--brand);border-color:#fff;box-shadow:none}
.jstep .go{margin-top:6px;font-weight:700;font-size:13px;display:flex;gap:4px;align-items:center}
.queue{padding:20px;margin-bottom:28px;display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr);gap:22px;align-items:start}
.queue .art{width:100%}
.qrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.qrow span{flex:1;font-weight:600}
.qrow .btn{min-height:36px;padding:0 14px;font-size:13px}
.welcome{background:var(--surface);border-radius:26px;width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:30px;animation:pop .4s var(--ease) both}
.welcome ol{list-style:none;padding:0;margin:18px 0 22px;display:grid;gap:10px}
.welcome li{display:flex;gap:12px;align-items:flex-start;font-size:14px}
.welcome li b{display:block;font-size:15px}
@media(max-width:1000px){.nav .grp{display:none}.nav button{flex:1 1 0;min-width:0}.nav .num{width:24px;height:24px;border-color:var(--muted);color:var(--ink)}.nav button.on .num{border-color:#fff;color:#fff}.journey{grid-template-columns:repeat(2,minmax(0,1fr))}.queue{grid-template-columns:minmax(0,1fr)}.queue .art{max-width:220px}}
@media(max-width:1000px){
  #app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;padding:6px;z-index:10;border-right:0;border-top:1px solid var(--line)}
  .side .logo,.upsell,.me{display:none}
  .nav{display:flex;width:100%}
  .nav button{flex-direction:column;gap:2px;font-size:10.5px;padding:6px 2px;justify-content:center}
  main{padding-bottom:110px}
  .g-home,.feedwrap,.chat,.brandgrid{grid-template-columns:minmax(0,1fr)}
  .chat{height:auto}.chat .agent{display:none}.msgs{max-height:60vh}
  .sheet{grid-template-columns:minmax(0,1fr)}
}
@media(max-width:700px){
  .niches{grid-template-columns:minmax(0,1fr)}
  .wk{grid-template-columns:repeat(7,minmax(110px,1fr));overflow-x:auto}
  .cal .c{min-height:70px;padding:4px}.pchip{font-size:0;padding:4px;min-height:8px}.pchip::before{font-size:9px}
  .nav button>span:not(.num){display:none}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<body>
<div id="root"></div>
<script>
{

function ask(q){

 S.chat[k].push({r:'u',t:q});renderView();
 const m=document.getElementById('msgs');const ty=document.createElement('div');ty.className='msg a typing';ty.innerHTML='<span></span><span></span><span></span>';m.appendChild(ty);m.scrollTop=m.scrollHeight;
 let ans=n.ia[q];
 if(!ans){const ql=q.toLowerCase();const hit=n.pautas.find(p=>ql.split(/\W+/).some(w=>w.length>4&&p[0].toLowerCase().includes(w)));
  ans=hit?`Encontrei uma pauta no seu banco que conversa com isso: <b>“${esc(hit[0])}”</b> (${hit[1]}, ${hit[2]}).\n\nGancho: ${esc(hit[3])}\n\nQuer que eu escreva a legenda no tom ${S.tone.toLowerCase()} ou monte o roteiro das telas?`:`Boa! Pra “${esc(q)}”, eu seguiria assim:\n\n• <b>Gancho:</b> uma pergunta que o seu público já se faz\n• <b>Desenvolvimento:</b> 3 telas curtas, uma ideia por tela\n• <b>Fechamento:</b> convite pra salvar e compartilhar\n\nPosso transformar isso em pauta e colocar no calendário?`}
 const avoid=[...new Set(S.chat[k].filter(x=>x.fb==='no').map(x=>x.why.toLowerCase()))];if(avoid.length)ans=`<b>Ajustei pelo que você me ensinou</b> (nada de: ${esc(avoid.join(', '))}).\n\n`+ans;
 setTimeout(()=>{ty.remove();const el=document.createElement('div');el.className='msg a';m.appendChild(el);
  const plain=ans;let i=0;const step=()=>{i=Math.min(plain.length,i+4);let s=plain.slice(0,i);const open=(s.match(/<b>/g)||[]).length,cl=(s.match(/<\/b>/g)||[]).length;if(s.lastIndexOf('<')>s.lastIndexOf('>'))s=s.slice(0,s.lastIndexOf('<'));el.innerHTML=s+(open>cl?'</b>':'');m.scrollTop=m.scrollHeight;if(i<plain.length)setTimeout(step,14);else{S.chat[k].push({r:'a',t:ans});busy=false;if(S.niche===k&&S.view==='ia')renderView()}};step()},900);
}

async function bootReal(){
 if(!REAL)return;
 const q=new URLSearchParams(location.search);
 if(q.has('s')||q.has('erro')){loadState();if(q.get('s')){SESSION=q.get('s');try{localStorage.setItem('pautei_s',SESSION)}catch(_){}}history.replaceState(null,'',location.pathname)}
 if(q.get('erro'))setTimeout(()=>alertBox('Não deu pra conectar',q.get('erro')),400);
 if(!SESSION){render();return}
 try{const me=await api('/me');
  if(me.connected){for(const k of ['fisio','adv']){S.ig[k]=true;if(me.picture)S.avatar[k]=me.picture}S.handle=me.username;S.realUser=me;if(q.get('s'))setTimeout(()=>toast('Instagram @'+me.username+' conectado de verdade'),300)}

}

 const bg={'s-brand':brandC,'s-light':'#FFFFFF','s-lime':lime,'s-dark':ink}[style]||brandC;
 let fg=style==='s-light'||style==='s-lime'?ink:'#FFFFFF';
 x.fillStyle=bg;x.fillRect(0,0,W,H);
 if(ph){fg='#FFFFFF';const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=ph.url});
  const dw=W*ph.z/100,dh=dw*img.height/img.width,fw=dh<H?H*img.width/img.height:dw,fh=dh<H?H:dh;
  x.drawImage(img,(W-fw)*ph.x/100,(H-fh)*ph.y/100,fw,fh);
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(.3,'rgba(21,19,31,.15)');g.addColorStop(1,'rgba(21,19,31,.78)');x.fillStyle=g;x.fillRect(0,0,W,H)}
 else{x.fillStyle=style==='s-light'?'rgba(21,19,31,.04)':'rgba(255,255,255,.12)';x.beginPath();x.arc(W*.9,W*.12,W*.3,0,Math.PI*2);x.fill()}
 // cabeçalho
 x.fillStyle=fg;x.globalAlpha=.9;x.font='700 39px Figtree, sans-serif';x.textBaseline='middle';
 const nm=bname().toUpperCase().split('').join(String.fromCharCode(8202));x.fillText(nm,P,P+24);x.globalAlpha=1;
 const lr=W*.045,lx=W-P-lr,ly=P+24;x.fillStyle=style==='s-light'?brandC:style==='s-lime'?ink:'#FFFFFF';x.beginPath();x.arc(lx,ly,lr,0,Math.PI*2);x.fill();
 x.fillStyle=style==='s-light'?'#FFFFFF':style==='s-lime'?lime:brandC;x.font='800 36px Figtree, sans-serif';x.textAlign='center';x.fillText(initials(bname()),lx,ly+1);x.textAlign='left';
 // título
 const fs=W*.096,lh=fs*1.04,maxW=W-P*2;x.font=`800 ${fs}px "Bricolage Grotesque", sans-serif`;
 const text=style==='s-dark'?'“'+title+'”':title;const words=text.split(/\s+/);const lines=[];let cur='';
 for(const w of words){const t=cur?cur+' '+w:w;if(x.measureText(t).width>maxW&&cur){lines.push(cur);cur=w}else cur=t}if(cur)lines.push(cur);
 let bottom=H-P;
 if(style==='s-lime'){const bh=W*.1,bw=(maxW-W*.03)/2;x.fillStyle='rgba(255,255,255,.35)';rr(x,P,bottom-bh,bw,bh,W*.03);x.fill();x.fillStyle=ink;rr(x,P+bw+W*.03,bottom-bh,bw,bh,W*.03);x.fill();
  x.font='800 41px Figtree, sans-serif';x.fillStyle=ink;x.fillText('Mito',P+W*.03,bottom-bh/2);x.fillStyle=lime;x.fillText('Verdade',P+bw+W*.06,bottom-bh/2);bottom-=bh+W*.05}
 else if(style==='s-dark'){x.globalAlpha=.75;x.fillStyle='#FFFFFF';x.font='600 43px Figtree, sans-serif';x.fillText('— '+nn().nome,P,bottom-20);x.globalAlpha=1;bottom-=W*.09}
 else{const ct=style==='s-light'&&!ph?'Salve pra depois':'Arraste para o lado →';x.font='700 41px Figtree, sans-serif';const cw=x.measureText(ct).width+W*.08,chh=W*.075;x.fillStyle=lime;rr(x,P,bottom-chh,cw,chh,chh/2);x.fill();x.fillStyle=ink;x.fillText(ct,P+W*.04,bottom-chh/2+2);bottom-=chh+W*.05}
 if(style==='s-lime'){bottom-=0}
 x.fillStyle=fg;x.font=`800 ${fs}px "Bricolage Grotesque", sans-serif`;x.textBaseline='alphabetic';
 lines.forEach((l,i)=>x.fillText(l,P,bottom-(lines.length-1-i)*lh-fs*.18));
 if(style==='s-lime'){const ty=bottom-(lines.length)*lh-fs*.2;x.font='700 37px Figtree, sans-serif';const tw=x.measureText('Mito ou verdade?').width+W*.07;x.fillStyle='rgba(21,19,31,.08)';rr(x,P,ty-W*.065,tw,W*.065,W*.033);x.fill();x.fillStyle=ink;x.textBaseline='middle';x.fillText('Mito ou verdade?',P+W*.035,ty-W*.0325)}
 return cv.toDataURL('image/jpeg',.92);
}
function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
function publishBlock(){
 if(!REAL)return '';
 const d=new Date(Date.now()+15*60000);d.setSeconds(0,0);const loc=new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16);
 if(!S.realUser)return `<div class="realbox"><b>${ic('ig')} Publicar de verdade</b><p class="muted" style="margin:4px 0 10px;font-size:13px">Conecte seu Instagram pra publicar esta arte.</p><button class="btn pri" data-golive>Conectar Instagram</button></div>`;
 return `<div class="realbox"><b style="display:flex;gap:8px;align-items:center">${ic('ig')} Publicar no @${esc(S.realUser.username)}</b>
 <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn pri" id="pubnow">Publicar agora</button><input type="datetime-local" class="inp" id="pubwhen" value="${loc}" style="width:auto;min-height:44px"><button class="btn ghost" id="pubsched">Agendar</button></div><div id="pubst" class="muted" style="font-size:13px;margin-top:8px"></div></div>`;
}
async function doPublish(m,title,style,ph,when){
 const st=m.querySelector('#pubst'),bs=m.querySelectorAll('#pubnow,#pubsched');bs.forEach(b=>b.disabled=true);
 try{st.textContent='Gerando a arte em JPG…';const image=await renderJPEG(title,style,ph);
  st.textContent=when?'Agendando…':'Enviando pro Instagram… (leva uns segundos)';
  const r=await api('/publish',{method:'POST',body:JSON.stringify({image,caption:m.querySelector('#ec').value,scheduled_at:when||null})});
  if(r.scheduled){st.innerHTML='';m.remove();toast('Agendado de verdade para '+new Date(r.post.scheduled_at).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}));}
  else{m.remove();alertBox('Publicado no Instagram!','O post já está no seu perfil.',r.permalink?`<a class="btn ghost" href="${esc(r.permalink)}" target="_blank" rel="noopener">Ver no Instagram ${ic('arr')}</a>`:'')}
 }catch(e){st.innerHTML=`<span style="color:var(--coral)">${esc(e.message)}</span>`;bs.forEach(b=>b.disabled=false)}
}
async function postsModal(){
 const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="welcome" role="dialog"><div style="display:flex"><div><span class="eyebrow">PUBLICAÇÕES REAIS</span><h2 style="font-size:26px;font-weight:800;margin-top:6px">@${esc(S.realUser?.username||'')}</h2></div><button class="round x" data-x aria-label="Fechar">${ic('x')}</button></div><div id="pl" class="muted" style="margin-top:14px">Carregando…</div></div>`;
 document.body.appendChild(m);m.addEventListener('click',e=>{e.stopPropagation();if(e.target===m||e.target.closest('[data-x]'))m.remove()});
 try{const {posts}=await api('/posts');const lab={scheduled:'Agendado',publishing:'Publicando',published:'Publicado',error:'Erro'};
  m.querySelector('#pl').innerHTML=posts.length?posts.map(p=>`<div class="qrow"><img src="${esc(p.image_url)}" alt="" style="width:48px;height:60px;object-fit:cover;border-radius:8px"><span>${esc((p.caption||'').slice(0,60))}<br><small class="muted">${new Date(p.scheduled_at).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}${p.error?' · '+esc(p.error):''}</small></span><span class="st-chip ${p.status==='published'?'live':''}">${lab[p.status]||esc(p.status)}</span>${p.permalink?`<a class="link" href="${esc(p.permalink)}" target="_blank" rel="noopener">Ver</a>`:''}</div>`).join(''):'Nenhuma publicação ainda. Abra uma arte no editor e clique em “Publicar agora”.'}
 catch(e){m.querySelector('#pl').textContent=e.message}
}

/* ---------- Eventos ---------- */
document.addEventListener('click',e=>{
 const t=e.target.closest('button,[data-niche]');if(!t)return;const d=t.dataset;
 if(d.niche){S.niche=d.niche;S.color=null;render();return}
 if(d.go){S.step=+d.go;render();return}
 if(t.id==='create'){create();return}
 if(d.color){S.color=d.color;render();return}
 if(d.tone){S.tone=d.tone;document.querySelectorAll('[data-tone]').forEach(b=>b.classList.toggle('on',b===t));return}
 if(d.profile!==undefined){profileModal();return}
 if(d.avrm!==undefined){S.avatar[S.niche]=null;render();return}
 if(d.view){if(t.closest('.modal'))close();S.view=d.view;renderView();window.scrollTo({top:0,behavior:'smooth'});return}
 if(d.sw&&d.sw!==S.niche){S.niche=d.sw;S.color=null;S.pf='Todos';S.q='';
  document.querySelectorAll('[data-sw]').forEach(b=>b.classList.toggle('on',b===t));knob();document.body.classList.toggle('adv',S.niche==='adv');document.documentElement.style.setProperty('--art',brand());
  const c=document.getElementById('content');c.style.transition='opacity .2s';c.style.opacity=0;
  setTimeout(()=>{refreshMe();document.querySelector('.top small').textContent=`TERÇA, 24 DE NOVEMBRO · ${nn().short.toUpperCase()}`;renderView();c.style.opacity=1},200);return}
 if(d.edit){editor(d.edit,d.style);return}
 if(d.post!==undefined){drawer(+d.post);return}
 if(d.use){S.used.has(d.use)?S.used.delete(d.use):(S.used.add(d.use),toast('Pauta adicionada ao calendário'));renderView();return}
 if(d.pf){S.pf=d.pf;renderView();return}
 if(d.ask){ask(d.ask);return}
 if(t.id==='newpost'){editor(nn().pautas[2][0]);return}
 if(t.id==='gen'){S.view='ia';renderView();setTimeout(()=>ask(Object.keys(nn().ia)[1]),250);return}
 if(d.golive!==undefined){goLogin();return}
 if(d.realposts!==undefined){postsModal();return}
 if(t.id==='plans'){plansModal();return}
 if(d.igconnect!==undefined){oauth();return}
 if(d.boost!==undefined){boost(+d.boost);return}
 if(t.id==='newad'){S.adAcc[S.niche]?boost(-1):adSetup();return}
 if(d.adsetup!==undefined){adSetup();return}
 if(t.id==='bell'){toast('2 posts aguardando sua revisão');return}
 if(d.goal){dna().objetivo=d.goal;document.querySelectorAll('[data-goal]').forEach(b=>b.classList.toggle('on',b===t));return}
 if(d.rmtag){const[k,i]=d.rmtag.split(':');dna()[k].splice(+i,1);render();return}
 if(d.fb){const[i,v]=d.fb.split(':');const m=S.chat[S.niche][+i];
  if(v==='ok'){m.fb='ok';mem().push(`<b>Aprovou:</b> “${esc(m.t.replace(/<[^>]+>/g,'').split('\n').find(l=>l.trim()).slice(0,70))}…”`);toast('Guardado como exemplo do seu jeito')}
  if(v==='edit')m.editing=true;
  if(v==='no')m.fb='ask';
  renderView();if(v==='edit')document.getElementById('ed'+i)?.focus();return}
 if(d.why){const[i,w]=d.why.split(':');const m=S.chat[S.niche][+i];m.fb='no';m.why=w;mem().push(`<b>Evitar:</b> ${esc(w.toLowerCase())}`);toast('Anotado, não vou repetir');renderView();return}
 if(d.savedit){const i=+d.savedit,m=S.chat[S.niche][i];const v=document.getElementById('ed'+i).value;m.t=esc(v);m.editing=false;m.fb='edit';mem().push('<b>Reescreveu uma resposta:</b> sua versão virou referência de tom');toast('Sua versão virou referência');renderView();return}
 if(d.postart!==undefined){openPost(+d.postart);return}
 if(d.next){const i=STEPS.findIndex(x=>x[0]===d.next);fl()[d.next]=true;  if(i===3){fl()[d.next]=false;approve();return}
  S.view=STEPS[i+1][0];renderView();window.scrollTo({top:0,behavior:'smooth'});toast(`Passo ${i+1} concluído`);return}
 if(t.id==='excl'){toast('Template exclusivo: o designer cria um layout só pra sua marca');return}
 if(t.id==='redna'){S.step=3;S.back=true;render();window.scrollTo({top:0});return}
});
document.addEventListener('keydown',e=>{const a=e.target.dataset&&e.target.dataset.addtag;if(a&&e.key==='Enter'){e.preventDefault();const v=e.target.value.trim();if(v){dna()[a].push(v);render();const n=document.querySelector(`[data-addtag="${a}"]`);n&&n.focus()}}});
document.addEventListener('input',e=>{
 if(e.target.id==='f-name'){S.brandName=e.target.value||null;document.getElementById('pv').innerHTML=art(nn().pautas[0][0],'s-brand');const ai=document.querySelector('.photo-field .avimg');if(ai&&!avUrl())ai.textContent=initials(bname())}
 if(e.target.dataset&&e.target.dataset.dna){dna()[e.target.dataset.dna]=e.target.value}
 if(e.target.id==='f-ig'){S.handle=e.target.value.replace(/^@/,'')||null}
 if(e.target.id==='q'){S.q=e.target.value;const pos=e.target.selectionStart;renderView();const q=document.getElementById('q');q.focus();q.setSelectionRange(pos,pos)}
});
document.addEventListener('change',e=>{if(e.target.id==='avfile'&&!e.target.closest('.modal'))setAvatar(e.target,()=>render())});
document.addEventListener('submit',e=>{if(e.target.id==='cf'){e.preventDefault();const i=document.getElementById('ci');const v=i.value;i.value='';ask(v)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
window.addEventListener('resize',knob);
document.fonts&&document.fonts.ready.then(knob);
window.__pautei={renderJPEG};
REAL?bootReal():render();
}
